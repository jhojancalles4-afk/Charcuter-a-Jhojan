  </defs>
  <rect width="512" height="512" rx="110" fill="#0f172a" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#grad)" stroke-width="20" stroke-dasharray="16 10" />
  <circle cx="256" cy="256" r="185" fill="#1e293b" />
  
